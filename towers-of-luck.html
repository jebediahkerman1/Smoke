<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Towers Of Luck — SMOKE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111b29;color:#fff;font:14px Arial}#game{position:fixed;inset:0}#hud{position:fixed;z-index:3;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;text-shadow:1px 2px #000}#status,#items{background:#101820d9;border:1px solid #ffffff55;padding:10px}#items{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto} .slot{min-width:74px;padding:9px 7px;background:#26384b;border:2px solid #8292a1;text-align:center;font-weight:bold}.slot.active{border-color:#fff;background:#52733e}#menu{position:fixed;z-index:8;inset:0;background:#07101ddd;display:grid;place-items:center;text-align:center}#panel{width:min(520px,92vw);padding:26px;background:#192838;border:2px solid #9bb4ca;box-shadow:8px 8px #0008}h1{font-size:clamp(32px,7vw,56px);margin:0 0 8px;letter-spacing:-2px}p{color:#c5d2de;line-height:1.5}input,button{font:inherit;padding:11px;border:1px solid #9eb0c0;background:#263b50;color:white}button{cursor:pointer;font-weight:bold}button:hover{background:#557b42}#menu button{margin:5px}#hint{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);background:#101820bb;padding:8px 12px;white-space:nowrap;z-index:3}#toast{position:fixed;z-index:5;top:68px;left:50%;transform:translateX(-50%);background:#111d;padding:9px 14px;display:none}#cross{position:fixed;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;text-shadow:1px 1px #000;pointer-events:none}
</style></head><body><div id="game"></div><div id="cross">+</div><div id="hud"><div id="status">TOWERS OF LUCK · WAITING</div><div id="timer">ITEM DROP IN 5</div></div><div id="hint">WASD move · Mouse look · Space jump · Right-click place · Left-click attack</div><div id="items"></div><div id="toast"></div>
<div id="menu"><div id="panel"><h1>TOWERS OF LUCK</h1><p>Build up, bridge out, and fight to be the last player alive. Every 5 seconds you receive a random item.</p><input id="name" maxlength="18" placeholder="Player name" value="Player"><br><button id="create">CREATE ROOM</button><button id="join">JOIN ROOM</button><p id="roomInfo">Each player starts on their own 2×2 bedrock tower.</p><button id="start" style="display:none">START ROUND</button></div></div>
<script src="supabase-config.js"></script><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const $=id=>document.getElementById(id);const cfg=window.SMOKE_SUPABASE_CONFIG;
let client,channel,room='',id='',name='Player',host=false,started=false,alive=true,health=20,clock=5,selected=0,inventory=[],lastSend=0,velocityY=0,onGround=false;
const players=new Map(),blocks=new Map(),keys={};let yaw=0,pitch=-.22,locked=false;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x83b8df);scene.fog=new THREE.Fog(0x83b8df,70,180);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,500);camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));$('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x53616e,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(20,45,10);scene.add(sun);
const mat=(color)=>new THREE.MeshLambertMaterial({color});const mats={bedrock:mat(0x34383e),wool:mat(0xd64e4e),glass:new THREE.MeshLambertMaterial({color:0x8de8f2,transparent:true,opacity:.45}),stone:mat(0x858b92),wood:mat(0x98643c),water:new THREE.MeshLambertMaterial({color:0x348bd8,transparent:true,opacity:.65})};
const geo=new THREE.BoxGeometry(1,1,1);const ray=new THREE.Raycaster();
let me={x:0,y:3,z:0},floor=-999;
function blockKey(x,y,z){return x+','+y+','+z}
function addBlock(x,y,z,type,remote=false){const k=blockKey(x,y,z);if(blocks.has(k))return;const mesh=new THREE.Mesh(geo,mats[type]||mats.stone);mesh.position.set(x+.5,y+.5,z+.5);mesh.userData={x,y,z,type};scene.add(mesh);blocks.set(k,mesh);if(!remote&&channel)send('block',{x,y,z,type})}
function removeBlock(x,y,z,remote=false){const k=blockKey(x,y,z),m=blocks.get(k);if(!m)return;if(m.userData.type==='bedrock')return;scene.remove(m);blocks.delete(k);if(!remote&&channel)send('remove',{x,y,z})}
function platform(cx,cz){for(let x=0;x<2;x++)for(let z=0;z<2;z++)addBlock(cx+x,0,cz+z,'bedrock',true)}
function towerPositions(){return [[0,0],[24,0],[0,24],[24,24],[-24,0],[0,-24],[-24,-24],[24,-24],[-24,24]]}
function spawnPlayer(pid,pname,index){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(.65,1.1,.4),mat(0x4c7fc4));body.position.y=.85;g.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.48,.48,.48),mat(0xc98f62));head.position.y=1.65;g.add(head);const label=document.createElement('canvas');label.width=256;label.height=64;const c=label.getContext('2d');c.fillStyle='#0009';c.fillRect(0,0,256,64);c.fillStyle='white';c.font='bold 28px Arial';c.textAlign='center';c.fillText(pname.slice(0,18),128,42);const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(label),depthTest:false}));sprite.scale.set(2.4,.6,1);sprite.position.y=2.35;g.add(sprite);scene.add(g);players.set(pid,{g,name:pname,alive:true,health:20})}
function updatePlayer(p){if(!p||!p.id||p.id===id)return;let v=players.get(p.id);if(!v){spawnPlayer(p.id,p.name||'Player',0);v=players.get(p.id)}v.g.position.set(p.x,p.y,p.z);v.g.rotation.y=p.yaw||0;v.alive=p.alive!==false;v.g.visible=v.alive}
async function send(event,payload){if(channel)await channel.send({type:'broadcast',event,payload:{...payload,from:id}})}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1700)}
function setInventory(items){inventory=items;$('items').innerHTML='';items.forEach((it,i)=>{const el=document.createElement('div');el.className='slot'+(i===selected?' active':'');el.textContent=it.label;el.onclick=()=>{selected=i;setInventory(inventory)};$('items').appendChild(el)})}
const drops=[{label:'Wool ×8',type:'wool',count:8},{label:'Glass ×6',type:'glass',count:6},{label:'Stone ×8',type:'stone',count:8},{label:'Wood ×8',type:'wood',count:8},{label:'Water ×1',type:'water',count:1},{label:'Sword',type:'sword',count:1},{label:'Wool ×16',type:'wool',count:16},{label:'Stone ×16',type:'stone',count:16}];
function giveRandom(){const d=drops[Math.floor(Math.random()*drops.length)];inventory.push({...d});if(inventory.length>9)inventory.shift();selected=inventory.length-1;setInventory(inventory);toast('You received: '+d.label)}
function chooseSpawn(){const list=towerPositions();let index=0;for(const p of players.values())index++;const pos=list[index%list.length];return{x:pos[0]+.5,y:2.01,z:pos[1]+.5}}
function resetArena(){for(const m of blocks.values())scene.remove(m);blocks.clear();for(const [x,z] of towerPositions())platform(x,z);me=chooseSpawn();camera.position.set(me.x,me.y+1.5,me.z);health=20;alive=true;clock=5;started=true;inventory=[];giveRandom();$('menu').style.display='none';toast('Round started! Build to survive.')}
async function connect(isJoin){try{if(!cfg?.url||!cfg?.anonKey)throw Error('Supabase configuration missing');client=createClient(cfg.url,cfg.anonKey);name=$('name').value.trim().slice(0,18)||'Player';id=crypto.randomUUID();host=!isJoin;room=isJoin?(prompt('Enter room code')||'').trim().toUpperCase():Math.random().toString(36).slice(2,8).toUpperCase();if(!room)return;channel=client.channel('towers-luck-'+room,{config:{presence:{key:id},broadcast:{self:false}}});channel.on('presence',{event:'sync'},()=>{for(const entries of Object.values(channel.presenceState()))for(const p of entries)updatePlayer(p)});channel.on('broadcast',{event:'player'},({payload})=>updatePlayer(payload));channel.on('broadcast',{event:'block'},({payload})=>{if(payload.from!==id)addBlock(payload.x,payload.y,payload.z,payload.type,true)});channel.on('broadcast',{event:'remove'},({payload})=>{if(payload.from!==id)removeBlock(payload.x,payload.y,payload.z,true)});channel.on('broadcast',{event:'begin'},()=>{if(!started)resetArena()});channel.on('broadcast',{event:'death'},({payload})=>{const p=players.get(payload.id);if(p){p.alive=false;p.g.visible=false}checkWinner()});await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(Error('Connection timed out')),15000);channel.subscribe(async state=>{if(state==='SUBSCRIBED'){await channel.track({id,name,x:0,y:2,z:0,alive:true});clearTimeout(t);resolve()}if(state==='CHANNEL_ERROR'||state==='TIMED_OUT')reject(Error('Room connection failed'))})});$('roomInfo').textContent='ROOM '+room+' · Share this code with friends';if(host)$('start').style.display='inline-block';else $('roomInfo').textContent+=' · Waiting for host';toast('Connected to room '+room)}catch(e){toast(e.message||'Could not connect')}}
$('create').onclick=()=>connect(false);$('join').onclick=()=>connect(true);$('start').onclick=async()=>{if(!host)return;resetArena();await send('begin',{})};
function checkWinner(){if(!started)return;const aliveOthers=[...players.values()].filter(p=>p.alive).length+(alive?1:0);if(aliveOthers<=1){started=false;toast(alive?'YOU WIN! +10 SC (SMOKE COINS)':'ROUND OVER');$('menu').style.display='grid';$('roomInfo').textContent=alive?'You are the last player alive!':'A winner has been decided.'}}
function die(){if(!alive)return;alive=false;me.y=-100;camera.position.y=-100;send('death',{id});toast('You were eliminated!');checkWinner()}
function hurtPlayer(target,amount){if(!target||!target.alive)return;target.health-=amount;if(target.health<=0){target.alive=false;target.g.visible=false;send('death',{id:target.id})}}
function place(){if(!started||!alive||!inventory.length)return;const item=inventory[selected];if(item.type==='sword'){toast('Sword selected · left-click to attack');return}ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects([...blocks.values()]);if(!hits.length)return;const h=hits[0],n=h.face.normal;const x=Math.round(h.object.userData.x+n.x),y=Math.round(h.object.userData.y+n.y),z=Math.round(h.object.userData.z+n.z);if(y<1||y>80||Math.hypot(x+.5-me.x,z+.5-me.z)>36)return;if(blocks.has(blockKey(x,y,z)))return;addBlock(x,y,z,item.type);item.count--;if(item.count<=0)inventory.splice(selected,1);selected=Math.max(0,Math.min(selected,inventory.length-1));setInventory(inventory)}
function attack(){if(!started||!alive)return;const item=inventory[selected];if(!item||item.type!=='sword')return;for(const [pid,p] of players){if(!p.alive)continue;if(p.g.position.distanceTo(camera.position)<3.4){send('hit',{id:pid,damage:5});toast('Hit '+p.name);return}}}
channel?.on?.('broadcast',{event:'hit'},({payload})=>{if(payload.id===id&&alive){health-=payload.damage||5;if(health<=0)die();else toast('Hit! '+health+' HP')}});
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Digit')){selected=Math.max(0,Math.min(inventory.length-1,Number(e.code.slice(5))-1));setInventory(inventory)}});document.addEventListener('keyup',e=>keys[e.code]=false);
renderer.domElement.addEventListener('click',()=>{if(started&&!locked)renderer.domElement.requestPointerLock()});document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);document.addEventListener('mousemove',e=>{if(locked){yaw-=e.movementX*.002;pitch=Math.max(-1.35,Math.min(1.35,pitch-e.movementY*.002))}});
document.addEventListener('contextmenu',e=>{e.preventDefault();place()});document.addEventListener('mousedown',e=>{if(e.button===0&&locked)attack()});
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.04,(t-(loop.last||t))/1000);loop.last=t;if(started&&alive){const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const v=new THREE.Vector3();if(keys.KeyW)v.add(f);if(keys.KeyS)v.sub(f);if(keys.KeyD)v.add(r);if(keys.KeyA)v.sub(r);if(v.lengthSq())v.normalize().multiplyScalar(6*dt);me.x+=v.x;me.z+=v.z;if(keys.Space&&onGround){velocityY=8;onGround=false}velocityY-=20*dt;me.y+=velocityY*dt;const under=blocks.get(blockKey(Math.floor(me.x),Math.floor(me.y-.05),Math.floor(me.z)));if(under&&me.y<under.userData.y+1.15){me.y=under.userData.y+1.01;velocityY=0;onGround=true}if(me.y<-12)die();camera.position.set(me.x,me.y+1.5,me.z);camera.rotation.set(pitch,yaw,0);if(t-lastSend>100){lastSend=t;send('player',{id,name,x:me.x,y:me.y,z:me.z,yaw,alive,health}).catch(()=>{})}clock-=dt;if(clock<=0){clock=5;giveRandom() }$('timer').textContent='ITEM DROP IN '+Math.ceil(clock);$('status').textContent='TOWERS OF LUCK · '+(alive?'❤ '+health+' HP':'ELIMINATED')+' · '+(players.size+1)+' PLAYERS';}renderer.render(scene,camera)}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
