</style></head><body><header><a class="logo" href="index.html">SM<span>O</span>KE</a><b>PROP CHAOS · 3D PHYSICS SANDBOX</b><a href="index.html">← Store</a></header>
<div class="hud"><aside class="panel"><h3>SPAWN MENU</h3><div class="badge">SELECT A PROP, THEN CLICK IN THE WORLD</div><button data-kind="crate" class="active">📦 Wooden crate<small>Stackable physics prop</small></button><button data-kind="barrel">🛢️ Metal barrel<small>Heavy cylinder</small></button><button data-kind="ball">⚽ Bouncy ball<small>Rolls around</small></button><button data-kind="plank">🪵 Long plank<small>Build ramps and bridges</small></button><button data-kind="chair">🪑 Chair<small>Office furniture</small></button><button data-kind="cone">🚧 Traffic cone<small>Lightweight prop</small></button><button id="remove">🗑️ Remove aimed prop</button><button id="clear">♻ Clear all props</button></aside><aside class="panel right"><h3>TOOL GUN</h3><button id="tool" class="active">🧲 Physics Gun <small>Grab and move objects</small></button><button id="freeze">❄ Freeze aimed prop</button><button id="unfreeze">▶ Unfreeze props</button><h3>WORLD SETTINGS</h3><button id="gravity">🌎 Gravity: ON</button><button id="rainbow">🌈 Prop colours: OFF</button><div class="badge" id="count">PROPS: 0</div><div class="badge">Inspired by physics sandbox games. Original SMOKE prototype.</div></aside></div>
<div class="crosshair"></div><div class="hint">WASD move · Mouse look · Space jump · Click spawn / grab · E release · Esc unlock mouse</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{const scene=new THREE.Scene();scene.background=new THREE.Color(0x91b6ca);scene.fog=new THREE.Fog(0x91b6ca,32,100);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,150);camera.position.set(0,2.2,8);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight-48);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);renderer.domElement.style.position='absolute';renderer.domElement.style.top='48px';renderer.domElement.style.left='0';renderer.domElement.style.width='100%';renderer.domElement.style.height='calc(100% - 48px)';renderer.domElement.style.cursor='crosshair';
scene.add(new THREE.HemisphereLight(0xe8f5ff,0x53614c,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-8,15,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const groundMat=new THREE.MeshStandardMaterial({color:0x667e54,roughness:1});const ground=new THREE.Mesh(new THREE.BoxGeometry(100,1,100),groundMat);ground.position.y=-.5;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(100,100,0x425c3d,0x52694b);grid.position.y=.015;scene.add(grid);
for(let i=0;i<20;i++){let h=2+Math.random()*5;let b=new THREE.Mesh(new THREE.BoxGeometry(1.4,h,1.4),new THREE.MeshStandardMaterial({color:i%2?0x7d8e99:0x9da9b2}));b.position.set((Math.random()-.5)*60,h/2,(Math.random()-.5)*60-20);b.castShadow=true;b.receiveShadow=true;scene.add(b)}
const props=[],keys={},ray=new THREE.Raycaster();let selected='crate',tool=true,gravity=true,rainbow=false,grab=null,grabDistance=6,yaw=0,pitch=0,velocityY=0,onGround=false;const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.78});function make(kind,pos){let mesh, mass=1, color=0xb17b4a;switch(kind){case'crate':mesh=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),mat(0x9b6a3c));break;case'barrel':mesh=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,1.2,16),mat(0x6e8794));mass=2;break;case'ball':mesh=new THREE.Mesh(new THREE.SphereGeometry(.48,20,14),mat(0xe2b84d));break;case'plank':mesh=new THREE.Mesh(new THREE.BoxGeometry(3,.22,.7),mat(0x98643c));mass=1.5;break;case'chair':mesh=new THREE.Group();let seat=new THREE.Mesh(new THREE.BoxGeometry(.9,.15,.9),mat(0x4c6278));seat.position.y=.6;mesh.add(seat);let back=new THREE.Mesh(new THREE.BoxGeometry(.9,.9,.14),mat(0x4c6278));back.position.set(0,1.05,-.38);mesh.add(back);for(let x of [-.35,.35])for(let z of [-.35,.35]){let leg=new THREE.Mesh(new THREE.BoxGeometry(.1,.6,.1),mat(0x343b42));leg.position.set(x,.3,z);mesh.add(leg)}break;case'cone':mesh=new THREE.Mesh(new THREE.ConeGeometry(.38,1,16),mat(0xff773b));break}mesh.position.copy(pos);mesh.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(mesh);props.push({mesh,kind,vel:new THREE.Vector3(),mass,frozen:false,rotVel:new THREE.Vector3()});document.getElementById('count').textContent='PROPS: '+props.length;return props[props.length-1]}
function aimed(){ray.setFromCamera(new THREE.Vector2(0,0),camera);const all=[];props.forEach(p=>p.mesh.traverse(o=>{if(o.isMesh)all.push(o)}));const hits=ray.intersectObjects(all,false);if(!hits.length)return null;return props.find(p=>{let found=false;p.mesh.traverse(o=>{if(o===hits[0].object)found=true});return found})}
function remove(p){if(!p)return;scene.remove(p.mesh);let i=props.indexOf(p);if(i>=0)props.splice(i,1);if(grab===p)grab=null;document.getElementById('count').textContent='PROPS: '+props.length}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{selected=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b))});document.getElementById('clear').onclick=()=>{[...props].forEach(remove)};document.getElementById('remove').onclick=()=>remove(aimed());document.getElementById('tool').onclick=()=>{tool=!tool;document.getElementById('tool').classList.toggle('active',tool)};document.getElementById('freeze').onclick=()=>{let p=aimed();if(p)p.frozen=true};document.getElementById('unfreeze').onclick=()=>props.forEach(p=>p.frozen=false);document.getElementById('gravity').onclick=()=>{gravity=!gravity;document.getElementById('gravity').textContent='🌎 Gravity: '+(gravity?'ON':'OFF')};document.getElementById('rainbow').onclick=()=>{rainbow=!rainbow;document.getElementById('rainbow').textContent='🌈 Prop colours: '+(rainbow?'ON':'OFF')};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE')grab=null;if(e.code==='Space'&&onGround){velocityY=7;onGround=false}});addEventListener('keyup',e=>keys[e.code]=false);renderer.domElement.addEventListener('click',e=>{if(document.pointerLockElement!==renderer.domElement){renderer.domElement.requestPointerLock?.();return}let p=aimed();if(tool){if(p){grab=p;grabDistance=Math.max(2,camera.position.distanceTo(p.mesh.position))}else{const dir=new THREE.Vector3();camera.getWorldDirection(dir);make(selected,camera.position.clone().add(dir.multiplyScalar(6)).add(new THREE.Vector3(0,-.7,0)))}}else if(p){p.vel.add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(7));p.vel.y+=2}});addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.002;pitch-=e.movementY*.002;pitch=Math.max(-1.45,Math.min(1.45,pitch));camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0)}});addEventListener('resize',()=>{camera.aspect=innerWidth/(innerHeight-48);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight-48)});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.035);let forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));let move=new THREE.Vector3();if(keys.KeyW)move.add(forward);if(keys.KeyS)move.sub(forward);if(keys.KeyD)move.add(right);if(keys.KeyA)move.sub(right);if(move.lengthSq())move.normalize().multiplyScalar(7*dt);camera.position.add(move);if(gravity){velocityY-=18*dt;camera.position.y+=velocityY*dt;if(camera.position.y<1.7){camera.position.y=1.7;velocityY=0;onGround=true}}else{if(keys.Space)camera.position.y+=5*dt;if(keys.ShiftLeft)camera.position.y-=5*dt;onGround=true}camera.position.x=Math.max(-48,Math.min(48,camera.position.x));camera.position.z=Math.max(-48,Math.min(48,camera.position.z));let dir=new THREE.Vector3();camera.getWorldDirection(dir);props.forEach(p=>{if(rainbow&&p.mesh.material){p.mesh.traverse(o=>{if(o.isMesh&&o.material.color)o.material.color.setHSL((performance.now()/3000+props.indexOf(p)*.13)%1,.65,.55)})}if(grab===p){p.mesh.position.copy(camera.position.clone().add(dir.multiplyScalar(grabDistance)));p.vel.set(0,0,0);return}if(p.frozen)return;if(gravity)p.vel.y-=9.8*dt;p.mesh.position.addScaledVector(p.vel,dt);p.vel.multiplyScalar(Math.pow(.985,dt*60));if(p.mesh.position.y<.5){p.mesh.position.y=.5;if(p.vel.y<0)p.vel.y*=-.35;p.vel.x*=.91;p.vel.z*=.91}if(Math.abs(p.mesh.position.x)>49||Math.abs(p.mesh.position.z)>49)p.vel.multiplyScalar(-.5)});for(let i=0;i<props.length;i++)for(let j=i+1;j<props.length;j++){let a=props[i],b=props[j];if(a.frozen&&b.frozen)continue;let d=b.mesh.position.clone().sub(a.mesh.position),dist=d.length();if(dist>0&&dist<.9){d.normalize();if(!a.frozen)a.vel.addScaledVector(d,-.8);if(!b.frozen)b.vel.addScaledVector(d,.8);}}renderer.render(scene,camera)}animate();
})();</script></body></html>
